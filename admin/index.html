<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - YadStore</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/admin.css?v=1790432929">
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p>Memuat...</p>
</div>

<!-- ACCESS DENIED -->
<div class="denied-overlay" id="denied" style="display:none">
  <div class="denied-box">
    <div class="denied-icon">🚫</div>
    <h2>Akses Ditolak</h2>
    <p>Email kamu <strong id="denied-email">-</strong></p>
    <p>Tidak punya akses admin.</p>
    <button onclick="Admin.logout()" class="btn-primary">Logout</button>
    <a href="../" class="btn-secondary">Kembali ke Website</a>
  </div>
</div>

<!-- LOGIN -->
<div class="login-overlay" id="login" style="display:none">
  <div class="login-box">
    <div class="login-logo">🔐</div>
    <h2>Admin Login</h2>
    <p>Login dengan Google untuk mengakses admin panel</p>
    <button class="btn-google" onclick="Admin.loginGoogle()">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Login dengan Google
    </button>
    <p class="login-hint">Hanya email admin yang diizinkan</p>
  </div>
</div>

<!-- MAIN ADMIN -->
<div class="admin-layout" id="admin-app" style="display:none">
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <div class="admin-logo">Y</div>
      <span>Admin</span>
    </div>
    <nav>
      <a href="#" class="nav-item active" data-sec="dash">Dashboard</a>
      <a href="#" class="nav-item" data-sec="orders">Pesanan</a>
      <a href="#" class="nav-item" data-sec="withdrawals">Withdraw</a>
      <a href="#" class="nav-item" data-sec="limits">Min Withdraw</a>
      <a href="#" class="nav-item" data-sec="products">Produk & Markup</a>
      <a href="#" class="nav-item" data-sec="users">Users</a>
      <a href="#" class="nav-item" data-sec="settings">Pengaturan</a>
    </nav>
    <div class="admin-user">
      <div class="admin-user-avatar" id="admin-avatar">👤</div>
      <div class="admin-user-info">
        <div class="admin-user-name" id="admin-name">-</div>
        <div class="admin-user-email" id="admin-email">-</div>
      </div>
      <button class="btn-logout" onclick="Admin.logout()">Logout</button>
    </div>
    <a href="../" class="back-link">← Ke Website</a>
  </aside>
  <main class="admin-main">
    <header class="admin-header">
      <h1 id="sec-title">Dashboard</h1>
    </header>
    <div id="content"></div>
  </main>
</div>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/games-data.js"></script>
<script src="js/admin.js?v=1790432929"></script>
</body>
</html>
