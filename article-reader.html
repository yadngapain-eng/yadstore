<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 Baca — YadStore</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<style>
.reader-wrapper{max-width:820px;margin:0 auto;padding:40px 24px 80px}
.reader-back{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:100px;color:var(--text-muted);font-weight:700;font-size:13.5px;margin-bottom:32px;transition:all .3s;backdrop-filter:blur(10px)}
.reader-back:hover{color:var(--primary);border-color:var(--primary);transform:translateX(-4px)}
.reader-article{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:48px 40px;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.reader-hero{text-align:center;margin-bottom:40px;padding-bottom:32px;border-bottom:1px solid var(--border)}
.reader-cover{font-size:88px;margin-bottom:20px;filter:drop-shadow(0 0 30px rgba(0,229,255,.5))}
.reader-cats{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.reader-title{font-size:clamp(26px,4vw,38px);font-weight:900;line-height:1.2;margin-bottom:20px;color:var(--text)}
.reader-meta{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;color:var(--text-muted);font-size:13.5px;font-weight:600}
.reader-content{line-height:1.85;font-size:16.5px;color:var(--text)}
.reader-content h2{font-size:24px;font-weight:800;margin:36px 0 16px;color:var(--primary);position:relative;padding-left:16px}
.reader-content h2::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:4px;background:linear-gradient(180deg,#00e5ff,#7c4dff);border-radius:4px}
.reader-content h3{font-size:19px;font-weight:800;margin:24px 0 12px;color:var(--accent)}
.reader-content p{margin-bottom:16px}
.reader-content ul,.reader-content ol{margin:12px 0 20px 24px}
.reader-content li{margin-bottom:8px}
.reader-content b{color:var(--primary);font-weight:800}
.reader-content i{color:var(--accent);font-style:italic}
.reader-content code{background:rgba(0,229,255,.15);color:#00e5ff;padding:2px 8px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:14px}
.reader-content pre{background:#03050f;padding:20px;border-radius:12px;overflow-x:auto;margin:20px 0;border:1px solid rgba(0,229,255,.2);box-shadow:inset 0 0 20px rgba(0,229,255,.05)}
.reader-content pre code{background:none;color:#e8ecff;padding:0;font-size:13.5px;line-height:1.7}
.reader-related{margin-top:60px}
.reader-related h2{text-align:center;font-size:28px;font-weight:900;margin-bottom:24px}
.reader-related-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.reader-related-card{display:flex;align-items:center;gap:14px;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:16px;transition:all .3s;color:var(--text)}
.reader-related-card:hover{border-color:var(--primary);transform:translateY(-4px);box-shadow:var(--glow)}
.reader-related-icon{font-size:36px;flex-shrink:0}
.reader-related-card h4{font-size:15px;font-weight:700;margin-bottom:4px;line-height:1.3}
.reader-related-card p{font-size:12px;color:var(--text-muted)}
@media(max-width:640px){.reader-article{padding:32px 22px}.reader-cover{font-size:64px}}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<nav class="navbar">
  <a href="gateway.html" class="nav-brand">
    <span class="logo-svg">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <rect x="2" y="2" width="30" height="30" rx="8" stroke="#00e5ff" stroke-width="2"/>
        <path d="M10 12 L6 17 L10 22" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 12 L28 17 L24 22" stroke="#7c4dff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 9 L15 25" stroke="#ffd54f" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="brand-name">YadStore</span>
  </a>
  <button class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
  <div class="nav-links" id="navLinks">
    <a href="gateway.html">🚪 Gateway</a>
    <a href="index.html">🏠 Home</a>
    <a href="learn.html">📚 Belajar</a>
    <a href="store.html">🎮 Store</a>
    <a href="article.html" class="active">📰 Article</a>
    <a href="credit.html">💎 Credit</a>
    <a href="admin.html">🔐 Admin</a>
  </div>
</nav>

<main class="reader-wrapper">
  <div id="readerContainer"></div>
</main>

<footer>
  <p>Made with 💙 by <a href="credit.html">Ysdev</a></p>
  <p style="margin-top:6px">© 2026 YadStore. All rights reserved.</p>
</footer>

<div class="toast" id="toast"></div>

<script src="js/bg.js"></script>
<script src="js/articles-data.js"></script>
<script src="js/articles-render.js"></script>
<script src="js/app.js"></script>
<script src="js/animations.js"></script>
</body>
</html>
