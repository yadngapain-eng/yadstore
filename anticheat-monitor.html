<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti-Cheat Monitor</title>
<style>
body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: #e5e7eb; padding: 20px; margin: 0; }
h1 { color: #ff4b4b; font-size: 20px; }
.card { background: #1f1f1f; border-radius: 10px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #ff4b4b; }
.severity-low { border-left-color: #3b82f6; }
.severity-medium { border-left-color: #f59e0b; }
.severity-high { border-left-color: #ef4444; }
.severity-critical { border-left-color: #7f1d1d; background: #2a0a0a; }
.type { font-weight: 900; font-size: 14px; margin-bottom: 5px; }
.time { font-size: 11px; color: #999; }
.details { font-size: 12px; color: #ccc; margin-top: 8px; background: #000; padding: 8px; border-radius: 6px; overflow-x: auto; }
.btn { padding: 10px 20px; background: #58cc02; color: white; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; margin: 5px; }
.btn-danger { background: #ff4b4b; }
.empty { text-align: center; padding: 40px; color: #666; }
</style>
</head>
<body>
<h1>🚨 Anti-Cheat Monitor</h1>
<p style="color: #999; font-size: 13px">Data dari localStorage browser ini. Untuk data global, cek Telegram.</p>

<div style="margin-bottom: 20px">
  <button class="btn" onclick="refresh()">🔄 Refresh</button>
  <button class="btn btn-danger" onclick="clearAll()">🗑️ Clear</button>
</div>

<div id="stats" style="background: #1f1f1f; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none">
  <div id="stats-content"></div>
</div>

<div id="violations"></div>

<script>
function refresh() {
  var violations = [];
  try {
    violations = JSON.parse(localStorage.getItem('yadstore_anticheat_reports') || '[]');
  } catch (e) {}

  var container = document.getElementById('violations');
  var statsEl = document.getElementById('stats');
  var statsContent = document.getElementById('stats-content');

  if (violations.length === 0) {
    statsEl.style.display = 'none';
    container.innerHTML = '<div class="empty">✅ Tidak ada violation</div>';
    return;
  }

  // Stats
  var bySeverity = { low: 0, medium: 0, high: 0, critical: 0 };
  violations.forEach(function(v) {
    bySeverity[v.severity] = (bySeverity[v.severity] || 0) + 1;
  });

  statsEl.style.display = 'block';
  statsContent.innerHTML = 
    '<div style="font-size: 14px; font-weight: 900; margin-bottom: 10px">📊 Total: ' + violations.length + '</div>' +
    '<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center">' +
      '<div><div style="font-size: 20px; font-weight: 900; color: #3b82f6">' + bySeverity.low + '</div><div style="font-size: 10px; color: #999">LOW</div></div>' +
      '<div><div style="font-size: 20px; font-weight: 900; color: #f59e0b">' + bySeverity.medium + '</div><div style="font-size: 10px; color: #999">MEDIUM</div></div>' +
      '<div><div style="font-size: 20px; font-weight: 900; color: #ef4444">' + bySeverity.high + '</div><div style="font-size: 10px; color: #999">HIGH</div></div>' +
      '<div><div style="font-size: 20px; font-weight: 900; color: #7f1d1d">' + bySeverity.critical + '</div><div style="font-size: 10px; color: #999">CRITICAL</div></div>' +
    '</div>';

  // List
  container.innerHTML = violations.slice().reverse().map(function(v) {
    return '<div class="card severity-' + v.severity + '">' +
      '<div class="type">' + v.type.replace(/_/g, ' ').toUpperCase() + '</div>' +
      '<div class="time">🕐 ' + new Date(v.time).toLocaleString('id-ID') + '</div>' +
      '<div class="details">' + JSON.stringify(v.details, null, 2) + '</div>' +
    '</div>';
  }).join('');
}

function clearAll() {
  if (!confirm('Hapus semua violation?')) return;
  localStorage.removeItem('yadstore_anticheat_reports');
  localStorage.removeItem('yadstore_anticheat');
  refresh();
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
