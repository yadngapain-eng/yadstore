<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — YadStore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<nav class="navbar">
  <a href="gateway.html" class="nav-brand">
    <span class="logo-svg">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <rect x="2" y="2" width="30" height="30" rx="8" stroke="#00e5ff" stroke-width="2"/>
        <path d="M10 12 L6 17 L10 22" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 12 L28 17 L24 22" stroke="#7c4dff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 9 L15 25" stroke="#ffd54f" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="brand-name">YadStore</span>
  </a>
  <button class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
  <div class="nav-links" id="navLinks">
    <a href="gateway.html">🚪 Gateway</a>
    <a href="index.html" >🏠 Home</a>
    <a href="learn.html" >📚 Belajar</a>
    <a href="store.html" >🎮 Store</a>
    <a href="article.html" >📰 Article</a>
    <a href="credit.html" >💎 Credit</a>
    <a href="admin.html" class="active">🔐 Admin</a>
  </div>
</nav>

<div class="live-bar">
  <span class="live-dot"></span>
  <span>Live:</span>
  <span id="liveCount">0</span>
  <span>coders online</span>
  <span class="divider">•</span>
  <span>⭐ YadStore v2</span>
</div>


<section class="section" style="max-width:600px;text-align:center">
  <h2 class="section-title">🔐 <span class="gradient-text">Admin Panel</span></h2>

  <div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px;backdrop-filter:blur(20px)">
    <p style="color:var(--text-muted);margin-bottom:24px">Masukkan kredensial admin untuk melanjutkan.</p>

    <button class="btn btn-primary" onclick="adminLogin()" style="width:100%;justify-content:center">
      🔓 Login sebagai Admin
    </button>

    <p style="color:var(--text-muted);font-size:13px;margin-top:20px">
      Username & password diperlukan.
    </p>
  </div>
</section>


<footer>
  <p>Made with 💙 by <a href="credit.html">Ysdev</a></p>
  <p style="margin-top:6px">© 2026 YadStore. All rights reserved.</p>
</footer>

<div class="toast" id="toast"></div>

<script src="js/bg.js"></script>

<script src="js/app.js"></script>
</body>
</html>
