name: Deploy + Auto-Purge Cache

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify files
        run: |
          echo "Root:"
          ls -la
          echo ""
          echo "js/:"
          ls -la js/ 2>/dev/null || echo "No js folder"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=yadstore --branch=main

      - name: Purge Cloudflare Cache
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          echo "Purge Cloudflare cache..."
          if [ -z "$CF_ZONE_ID" ]; then
            echo "⚠️  CLOUDFLARE_ZONE_ID tidak diset — skip purge"
            exit 0
          fi
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}')
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✅ Cache purged!"
          else
            echo "❌ Purge gagal"
            exit 1
          fi

      - name: Verify live
        if: always()
        run: |
          sleep 10
          echo "Verify live site..."
          curl -s -I "https://duniamu.my.id/?nocache=${{ github.run_id }}" | head -20
